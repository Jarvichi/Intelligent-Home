name: "Intelligent Home - AI Layer - SerpApi Agent"
version: "0.1.0"
slug: ih_ai_layer_serpapi
description: "Agent of Intelligent Home - AI Layer. Answers cinema showtimes and web search questions through SerpApi (your own key, small daily cap, cached). Registers with the parent. No Home Assistant access. Maps no folders."
arch:
  - aarch64
  - amd64
startup: application
# boot: manual = start it yourself (the default here). To start with Home Assistant, set boot: auto (Supervisor option "Start on boot").
# After install the owner sets: boot auto, watchdog on, auto_update on.
# watchdog: add  watchdog: http://[HOST]:[PORT:8802]/healthz  once boot is auto; the Supervisor then restarts the add-on if /healthz stops answering.
boot: manual
init: false
ports:
  8802/tcp: 8802
ports_description:
  8802/tcp: "Signed /ask from the parent, plus /healthz and /status"
options:
  serpapi_key: ""
  register_key: ""
  parent_url: "http://172.30.32.1:8801"
  callback_url: ""
  daily_cap: 5
  cache_hours: 6
  default_cinema: ""
schema:
  serpapi_key: password
  register_key: password
  parent_url: str
  callback_url: str?
  daily_cap: int(0,250)
  cache_hours: int(0,168)
  default_cinema: str?
