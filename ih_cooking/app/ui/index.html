<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipes · Intelligent Home</title><link rel="stylesheet" href="ih-ui.css"><script defer src="ih-ui.js"></script>
<link rel="stylesheet" href="ih-patterns.css">
<style>
:root{--bg:var(--ih-bg);--card:var(--ih-surface);--ink:var(--ih-text);--muted:var(--ih-muted);--line:var(--ih-line);--accent:var(--ih-link);--ok:var(--ih-ok);--bad:var(--ih-danger)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--ih-font)}main{max-width:960px;margin:0 auto;padding:clamp(12px,3vw,24px)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--ih-radius-panel);padding:16px;margin-bottom:12px;box-shadow:var(--ih-shadow)}input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--ih-radius-control);padding:10px 12px;width:100%}input.s{border-radius:999px}textarea{min-height:90px}label{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--muted);display:block;margin:10px 0 3px}button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--ih-radius-control);padding:9px 14px;cursor:pointer;min-height:44px}button.p{background:var(--ih-accent);border-color:var(--ih-accent);color:var(--ih-accent-ink);font-weight:700}.item{display:flex;justify-content:space-between;gap:8px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}.item:last-child{border:0}.item{width:100%;text-align:left;background:transparent;border-radius:0;align-items:start}.item span{overflow-wrap:anywhere}.m{white-space:normal!important}h1{margin:4px 0;font-size:clamp(27px,4vw,36px)}header{margin-bottom:16px}.m{color:var(--muted);font-size:.85rem;white-space:nowrap}.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:110px}.st{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}.st b{min-width:62px;color:var(--accent)}#msg{min-height:1.3em;font-size:.9rem}.err{color:var(--bad)}.good{color:var(--ok)}h2{font-size:1.2rem;margin:0 0 6px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style></head><body><main>
<header><p class="ih-kicker">Intelligent Home</p><h1>Cooking</h1><p class="m">Choose a recipe, review its timeline and plan serving time.</p></header><section class="card" aria-label="Cooking status"><h2>Cooking session</h2><p id="session" role="status">Checking cooking status…</p><button id="session-refresh" type="button">Check again</button></section><p id="feedback" role="status"></p><div id="list"><div class="card"><div class="row" style="align-items:center"><div style="flex:4"><label for="q">Search recipes</label><input type="search" class="s" id="q" placeholder="Find a recipe..." autocomplete="off"></div><div style="flex:0 0 auto;min-width:0"><button class="p" id="new">New recipe</button></div></div><p id="recipe-count" role="status"></p><div id="items" style="margin-top:8px">Loading recipes…</div></div></div>
<div id="view" hidden></div>
</main>
<script>
const RK='ro'+'b_';
const $=s=>document.querySelector(s);let ALL=[],CUR=null;
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,o){const r=await fetch(p,o);const j=await r.json();if(!r.ok)throw j;return j}
async function init(){try{ALL=await api('api/recipes');draw()}catch(e){$('#items').textContent='Recipes unavailable. Reload to retry.';$('#feedback').textContent=e.error||'Could not load recipes.'}}
async function session(){try{const j=await api('api/cook');$('#session').textContent=(j.running?'Running: '+(j.title||'Cooking')+' · serving '+(j.eat||'time unavailable')+' · '+j.done+' of '+j.steps+' steps complete':'No cooking session running')+' · mode: '+(j.mode||'unknown')+' · checked '+new Date().toLocaleTimeString()}catch(e){$('#session').textContent='Cooking status unavailable. Try checking again.'}}
$('#session-refresh').onclick=session;
function draw(){const q=$('#q').value.toLowerCase();const matches=ALL.filter(r=>r.title.toLowerCase().includes(q)).sort((a,b)=>a.title.localeCompare(b.title));$('#recipe-count').textContent=matches.length+' of '+ALL.length+' recipes';$('#items').innerHTML=matches
 .map(r=>`<button type="button" class="item" data-id="${esc(r.id)}"><span>${esc(r.title)}</span><span class="m">${r.minutes} min${r.serves?' · serves '+r.serves:''}${r.oven?' · '+esc(r.oven)+'C':''}</span></button>`).join('')||(ALL.length?'<p class="m">No recipes match. Clear search to see all recipes.</p>':'<p class="m">No recipes yet. Create your first recipe.</p>')}
$('#q').oninput=draw;$('#new').onclick=()=>{CUR={title:'',oven:null,serves:'',steps:[],prep:[],shopping:[],_new:true};$('#list').hidden=true;$('#view').hidden=false;edit()};$('#items').onclick=e=>{const i=e.target.closest('.item');if(i)open(i.dataset.id)};
async function open(id){try{CUR=await api('api/recipes/'+encodeURIComponent(id));CUR._id=id;show();$('#back').focus()}catch(e){$('#feedback').textContent=e.error||'Could not open this recipe.'}}
function show(){const r=CUR,st=[...(r.steps||[])].sort((a,b)=>b.before-a.before);
 $('#list').hidden=true;$('#view').hidden=false;$('#view').innerHTML=`<div class="card"><button id="back">&larr; All recipes</button>
 <h2 style="margin-top:12px">${esc(r.title||r.name)}</h2><div class="m">${r.oven?'Oven '+r.oven+'C · ':''}${r.serves?'Serves '+r.serves+' · ':''}Child messaged ${r[RK+'minutes']??15} min before</div>
 <h3>Step timeline · before serving</h3>${st.map(s=>`<div class="st"><b>${s.before} min</b><span>${esc(s.text)}</span></div>`).join('')}
 <h3>Prep</h3>${(r.prep||[]).map(p=>'<div>- '+esc(p)+'</div>').join('')||'<div class="m">none</div>'}
 <h3>Shopping</h3>${(r.shopping||[]).map(p=>'<div>- '+esc(p)+'</div>').join('')||'<div class="m">none</div>'}
 <div class="bar"><button id="ed">Edit</button><button class="p" id="cook">Cook this now</button></div><div id="msg"></div></div>`;
 $('#back').onclick=()=>{$('#view').hidden=true;$('#list').hidden=false};$('#ed').onclick=edit;$('#cook').onclick=cook}
const lines=a=>(a||[]).join('\n'),unl=t=>t.split('\n').map(x=>x.trim()).filter(Boolean);
function edit(){const r=CUR;$('#view').innerHTML=`<div class="card"><h2>${r._new?'New recipe':'Edit: '+esc(r.title||r.name)}</h2>
 <label for="e_title">Title</label><input id="e_title" value="${esc(r.title||r.name)}">
 <div class="row"><div><label for="e_oven">Oven (C)</label><input id="e_oven" type="number" value="${r.oven||''}"></div><div><label for="e_serves">Serves</label><input id="e_serves" value="${r.serves||''}"></div><div><label for="e_kid">Child message (min before)</label><input id="e_kid" type="number" value="${r[RK+'minutes']??15}"></div></div>
 <label for="e_steps">Steps (one per line: minutes before serving | text)</label><textarea id="e_steps" style="min-height:220px">${esc(r.steps.map(s=>s.before+' | '+s.text).join('\n'))}</textarea>
 <label for="e_prep">Prep (one per line)</label><textarea id="e_prep">${esc(lines(r.prep))}</textarea>
 <label for="e_shop">Shopping (one per line)</label><textarea id="e_shop">${esc(lines(r.shopping))}</textarea>
 <div class="bar"><button class="p" id="sv">Save</button><button id="cx">Cancel</button></div><div id="msg"></div></div>`;
 $('#cx').onclick=()=>{if(CUR._new){$('#view').hidden=true;$('#list').hidden=false}else show()};$('#sv').onclick=save}
async function save(){const num=v=>v===''?null:Number(v);
 if(!$('#e_title').value.trim())return msg('Enter a recipe title.','err');
 const steps=unl($('#e_steps').value).map(l=>{const i=l.indexOf('|');return{before:i<0?NaN:Number(l.slice(0,i).trim()),text:l.slice(i+1).trim()}});
 if(!steps.length||steps.some(s=>!Number.isInteger(s.before)||!s.text))return msg('Each step line needs: minutes | text','err');
 const d={title:$('#e_title').value.trim(),oven:num($('#e_oven').value),serves:(v=>/^\d+$/.test(v)?Number(v):v)($('#e_serves').value.trim()),[RK+'minutes']:num($('#e_kid').value)??15,steps,prep:unl($('#e_prep').value),shopping:unl($('#e_shop').value)};
 try{if(CUR._new){const c=await api('api/recipes',{method:'POST',body:JSON.stringify(d)});CUR=await api('api/recipes/'+c.created);CUR._id=c.created;ALL=await api('api/recipes');draw();show();return msg('Created','good')}
  const savedId=CUR._id;await api('api/recipes/'+savedId,{method:'PUT',body:JSON.stringify(d)});CUR=await api('api/recipes/'+savedId);CUR._id=savedId;ALL=await api('api/recipes');draw();show();msg('Saved (backup kept)','good')}
 catch(e){msg((e.errors||[e.error||'failed']).join('; '),'err')}}
function msg(t,c){const m=$('#msg');if(m){m.textContent=t;m.className=c||''}}
function cook(){$('#msg').innerHTML=`<div class="row" style="align-items:end;margin-top:8px"><div><label for="eat">Eat time</label><input id="eat" type="time" value="18:30"></div><div><button class="p" id="go">Start cooking mode</button></div></div>
 <div class="m">Starts spoken steps on the kitchen HomePod and the wall display cooking screen.</div>`;
 $('#go').onclick=async()=>{if(!confirm('Start cooking mode for '+(CUR.title||CUR.name)+' at '+$('#eat').value+'?'))return;
  const live=true;
  try{const j=await api('api/cook',{method:'POST',body:JSON.stringify({name:CUR._id,eat:$('#eat').value})});
   const sl=(j.steps||[]).map(x=>'<div class="st"><b>'+esc(x.at||x.time||'')+'</b><span>'+esc(x.text||x.short||JSON.stringify(x))+'</span></div>').join('');
   $('#msg').className='good';$('#msg').innerHTML=esc(j.dry_run?'Shadow mode (nothing is sent): '+j.would_run:'Started: '+j.result)+sl+'<div class="bar"><button id="stat">Cook status</button><button id="stop">Stop cooking</button></div><pre id="cs" class="m" style="white-space:pre-wrap"></pre>';
   $('#stat').onclick=async()=>{try{$('#cs').textContent='Refreshing session status…';await session();$('#cs').textContent=$('#session').textContent}catch(e){msg('status failed','err')}};
   $('#stop').onclick=async()=>{if(!confirm('Stop cooking mode?'))return;try{await api('api/cook/stop',{method:'POST',body:'{}'});$('#cs').textContent='Stop requested';await session()}catch(e){msg('stop failed','err')}}}
  catch(e){msg((e.errors||['failed']).join('; '),'err')}}}
init();session();
</script></body></html>
