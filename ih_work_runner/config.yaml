name: "Intelligent Home - Work Runner"
version: "0.2.1"
slug: ih_work_runner
image: "ghcr.io/jarvichi/{arch}-ih_work_runner"
description: "Runs the Claude work for the Work add-on: claims a job, runs it with the Claude CLI, reports the result on the task. Replaces the loop that used to start from the host's tmux. Starts in DRY (watches, claims nothing). Never runs twice at once (a lock file). A STOP file or the stop option pauses it."
arch:
  - aarch64
  - amd64
startup: application
# boot: manual = start it yourself (the default here). After install the owner sets: boot auto, watchdog on, auto_update on.
# watchdog: add  watchdog: http://[HOST]:[PORT:8847]/healthz  once boot is auto.
boot: manual
init: false
ingress: true
ingress_port: 8099
panel_title: "IH · Work Runner"
panel_icon: mdi:robot-outline
panel_admin: true
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
  - type: share
    read_only: false
ports:
  8847/tcp: 8847
ports_description:
  8847/tcp: "Health check (/healthz) and a status line, no secrets"
options:
  mode: "dry"
  stop: false
  work_token: ""
  claude_oauth_token: ""
  mcp_config_file: ""
  work_url: ""
  idle_max_s: 300
  idle_check_s: 15
schema:
  mode: list(dry|live)
  stop: bool
  work_token: password
  claude_oauth_token: password?
  mcp_config_file: str?
  work_url: str?
  idle_max_s: int(15,3600)
  idle_check_s: int(5,300)
