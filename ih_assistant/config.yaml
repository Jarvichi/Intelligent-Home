name: "Intelligent Home - Assistant - Personas"
version: "0.7.0"
slug: ih_assistant
image: "ghcr.io/jarvichi/{arch}-ih_assistant"
description: "Personal assistant transport for several personas in one add-on: reads each person's private Discord messages through that persona's own bot, queues check-ins, and sends replies written elsewhere. Every persona has its own separate datastore. DRY-RUN by default."
arch:
  - aarch64
  - amd64
startup: application
# boot: manual = start it yourself. After install the owner sets: boot auto, watchdog on, auto_update on.
# watchdog: add  watchdog: http://[HOST]:[PORT:8830]/healthz  once boot is auto.
boot: manual
init: false
homeassistant_api: true
ports:
  8830/tcp: 8830
ports_description:
  8830/tcp: "Persona API (bearer api_token); /healthz is open"
options:
  mode: "dry"
  api_token: ""
  timezone: "Europe/London"
  facts_url: ""
  facts_key: ""
  personas: []
schema:
  mode: list(dry|live)
  api_token: password
  timezone: str
  facts_url: str?
  facts_key: password?
  usage_sensor_session: str?
  usage_sensor_week: str?
  usage_sensor_session_reset: str?
  usage_sensor_week_reset: str?
  personas:
    - key: str
      user_id: str
      bot_token: password
      quiet_start: str?
      quiet_end: str?
      max_per_day: int?
      checkins:
        - str?
      can_tell:
        - str?
      live: bool?
      checkin_plan: bool?
      checkins_per_day: str?
      busy_windows:
        - str?
      free_windows:
        - str?
      wake_start: str?
      wake_end: str?
      min_gap_h: float?
      calendars:
        - str?
      meal_plan_entity: str?
      meal_fact: str?
      presence_entity: str?
      quiet_if_messaged_h: float?
      checkin_days:
        - str?
      closed_dates:
        - str?
      checkin_texts:
        - str?
      checkin_send: bool?
      usage_text: str?
      usage_text_notime: str?
      emoji_level: int(0,10)?
      gif_level: int(0,10)?
      checkin_level: int(0,10)?
      humour_level: int(0,10)?
      formality_level: int(0,10)?
      verbosity_level: int(0,10)?
      banter_level: int(0,10)?
      reminders_level: int(0,10)?
      funny_level: int(0,10)?
      sarcastic_level: int(0,10)?
      warm_level: int(0,10)?
      blunt_level: int(0,10)?
      fixed_rule: str?
