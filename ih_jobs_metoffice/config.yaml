name: "Intelligent Home - Jobs - Met Office"
version: "0.1.0"
slug: ih_jobs_metoffice
description: "Child of Intelligent Home - Jobs. Met Office forecast sensors with a fallback to the Home Assistant weather entity. DRY-RUN by default. Registers with the parent."
arch:
  - aarch64
  - amd64
startup: application
# boot: manual = start it yourself (the default here). To start with Home Assistant, set boot: auto (Supervisor option "Start on boot").
# watchdog: add  watchdog: http://[HOST]:[PORT:8799]/healthz  once boot is auto; the Supervisor then restarts the add-on if /healthz stops answering.
boot: manual
init: false
homeassistant_api: true
ports:
  8799/tcp: 8799
ports_description:
  8799/tcp: "Health, status and signed run requests (/healthz, /status, /run)"
options:
  mode: "dry"
  old_loops_disabled: false
  parent_url: "http://172.30.32.1:8792"
  callback_url: ""
  register_key: ""
  own_timer_min: 0
  met_office_key: ""
  timezone: "Europe/London"
  zone_entity: "zone.home"
  fallback_weather_entity: "weather.forecast_home"
schema:
  mode: list(dry|live)
  old_loops_disabled: bool
  parent_url: str
  callback_url: str?
  register_key: password
  own_timer_min: int(0,1440)
  met_office_key: password
  timezone: str
  zone_entity: str
  fallback_weather_entity: str
