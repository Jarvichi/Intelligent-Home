name: "Intelligent Home - AI Layer - Mistral"
version: "0.1.2"
slug: ih_ai_layer_mistral
description: "Agent of Intelligent Home - AI Layer. Answers general questions and summarizes text through a Mistral agent (Agents conversations endpoint, your own key, daily cap). Text is scrubbed of personal data before it leaves the house. Registers with the parent. No Home Assistant access. Maps no folders."
arch:
  - aarch64
  - amd64
startup: application
# boot: manual = start it yourself (the default here). To start with Home Assistant, set boot: auto (Supervisor option "Start on boot").
# After install the owner sets: boot auto, watchdog on, auto_update on.
# watchdog: add  watchdog: http://[HOST]:[PORT:8812]/healthz  once boot is auto; the Supervisor then restarts the add-on if /healthz stops answering.
boot: manual
init: false
ports:
  8812/tcp: 8812
ports_description:
  8812/tcp: "Signed /ask from the parent, plus /healthz and /status"
options:
  mistral_key: ""
  register_key: ""
  parent_url: "http://172.30.32.1:8801"
  callback_url: ""
  model: "mistral-medium-latest"
  agent_id: ""
  spend_cap: 0
  free_tier: true
  daily_cap: 50
  timeout_s: 30
  shadow: true
  max_chars: 1900
  log_payloads: false
schema:
  mistral_key: password
  register_key: password
  parent_url: str
  callback_url: str?
  model: str
  agent_id: str?
  spend_cap: int(0,1000)
  free_tier: bool
  daily_cap: int(0,1000)
  timeout_s: int(5,120)
  shadow: bool
  max_chars: int(100,4000)
  log_payloads: bool?
