name: "Intelligent Home - Orchestration - Inbox"
version: "0.1.0"
slug: ih_orchestration_inbox
description: "Durable inbox for messages on chosen Discord channel keys, as a module of the ih_discord transport. It claims the channel keys you list, stores each message in a queue (7 days), reacts with an eye emoji so the sender knows it arrived, and never answers in the channel. Claude and workers read the queue over a token-protected local API. SHADOW mode by default: queue is written, no reactions. No Home Assistant access. Maps no folders."
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
ports:
  8800/tcp: 8800
ports_description:
  8800/tcp: "Queue API (token) plus health and status (/healthz, /status)"
options:
  module_name: "ih_orchestration_inbox"
  signing_key: ""
  shadow: true
  channel_keys: []
  ack_emoji: "👀"
  retention_days: 7
  api_token: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: "ih_orchestration_inbox"
  mqtt_password: ""
  ingest_url: "http://172.30.32.1:8790"
  ingest_token: ""
schema:
  module_name: str
  signing_key: password
  shadow: bool
  channel_keys:
    - str
  ack_emoji: str
  retention_days: int(1,30)
  api_token: password
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  ingest_url: str
  ingest_token: password
