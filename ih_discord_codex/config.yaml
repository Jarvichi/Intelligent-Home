name: "Intelligent Home - Discord - Codex"
version: "0.1.34"
slug: ih_discord_codex
image: "ghcr.io/jarvichi/{arch}-ih_discord_codex"
description: "A private Codex worker with filtered Home Assistant tools and a private IH code review branch, connected through the signed Discord transport."
homeassistant_api: true
arch:
  - aarch64
  - amd64
startup: application
privileged:
  - SYS_ADMIN
  - NET_ADMIN
  - SYS_PTRACE
boot: manual
init: false
ingress: true
ingress_port: 8812
panel_title: "IH · Discord Codex"
panel_icon: mdi:home-circle
panel_admin: true
map:
  - addon_config:rw
ports:
  8815/tcp: 8815
ports_description:
  8815/tcp: "Private module health and status"
options:
  module_name: "ih_discord_codex"
  signing_key: ""
  shadow: true
  channel_keys: []
  allowed_user_ids: []
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: "ih_discord_codex"
  mqtt_password: ""
  brain_read_token: ""
  github_repo_token: ""
  review_channel_key: "claude_review"
schema:
  module_name: str
  signing_key: password
  shadow: bool
  channel_keys:
    - str
  allowed_user_ids:
    - str
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  brain_read_token: password
  github_repo_token: password
  review_channel_key: str?
