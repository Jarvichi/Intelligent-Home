<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Games · Intelligent Home</title>
  <link rel="stylesheet" href="ih-ui.css">
  <link rel="stylesheet" href="ih-patterns.css?v=1">
  <link rel="stylesheet" href="ui.css?v=10">
</head>
<body>
  <ih-app class="games-app">
    <main class="games-main">
      <div class="topline ih-page-heading">
        <div>
          <h1>Games</h1>
        </div>
        <ih-status id="service-status" class="livepill" status="unknown" role="status" aria-live="polite">Connecting…</ih-status>
      </div>
      <div class="library-navigation">
        <ih-tabs id="players" class="games-nav" aria-label="Choose a player" role="tablist"></ih-tabs>
        <button id="research" class="ih-button research-toggle" type="button" aria-pressed="false" aria-controls="library">Research</button>
      </div>
      <section id="library" aria-live="polite" aria-busy="true"><p class="ih-muted">Loading game library…</p></section>
      <footer class="games-footer"><span>INTELLIGENT HOME</span><a href="/app/32c8114c_ih_orchestrator">Operations console</a></footer>
    </main>
  </ih-app>
  <script src="ih-ui.js"></script>
  <script src="ui.js?v=10"></script>
</body>
</html>
