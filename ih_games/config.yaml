
name: "Intelligent Home Games"
version: "0.1.0"
slug: ih_games
description: "Game activity facts feeds and chat message orchestrator. DRY-RUN by default."
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
homeassistant_api: true
ports:
  8793/tcp: 8793
ports_description:
  8793/tcp: "Health and status (/healthz, /status)"
options:
  mode: "dry"
  players:
    - key: "player_a"
      display_name: "Player A"
      trophy_prefix: "player_a"
      speaker: "bot_alpha"
    - key: "player_b"
      display_name: "Player B"
      trophy_prefix: "player_b"
      speaker: "bot_beta"
  providers_enabled:
    - "psn_trophies"
  quiet_start: "22:00"
  quiet_end: "08:00"
  timezone: "Europe/London"
  ingest_url: "http://172.30.32.1:8790"
  ingest_token: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: "ih_games"
  mqtt_password: ""
  enable_scheduler: false
  signing_key: ""
schema:
  mode: list(dry|live)
  players:
    - key: str
      display_name: str
      trophy_prefix: str
      speaker: str
  providers_enabled:
    - str
  quiet_start: str
  quiet_end: str
  timezone: str
  ingest_url: str
  ingest_token: password
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  enable_scheduler: bool
  signing_key: password


