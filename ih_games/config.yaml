
name: "Intelligent Home Games"
version: "0.6.0"
slug: ih_games
image: "ghcr.io/jarvichi/{arch}-ih_games"
description: "Game activity facts feeds and chat message orchestrator. DRY-RUN by default."
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
homeassistant_api: true
ports:
  8794/tcp: 8794
ports_description:
  8794/tcp: "Health and status (/healthz, /status); library and game tool API (/library, /games/<id>/..., bearer admin_token)"
options:
  log_payloads: false
  mode: "dry"
  players:
    - key: "player_a"
      display_name: "Player A"
      trophy_prefix: "player_a"
      xbox_prefix: "player_a"
      speaker: "bot_alpha"
    - key: "player_b"
      display_name: "Player B"
      trophy_prefix: "player_b"
      speaker: "bot_beta"
  providers_enabled:
    - "psn_trophies"
  quiet_start: "22:00"
  quiet_end: "08:00"
  timezone: "Europe/London"
  ingest_url: "http://172.30.32.1:8790"
  ingest_token: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: "ih_games"
  mqtt_password: ""
  enable_scheduler: false
  signing_key: ""
  outbox_token: ""
  assistant_url: ""
  assistant_token: ""
  bungie_api_key: ""
  destiny_poll_s: 900
  admin_token: ""
  arc_data_dir: ""
  destiny_reset_utc_hour: 17
  todo_entity: "todo.claude_to_do"
  todo_sync: true
schema:
  log_payloads: bool?
  mode: list(dry|live)
  players:
    - key: str
      display_name: str
      trophy_prefix: str?
      xbox_prefix: str?
      xbox_gamerscore_entity: str?
      xbox_now_playing_entity: str?
      steam_prefix: str?
      steam_now_playing_entity: str?
      steam_level_entity: str?
      destiny_type: int?
      destiny_id: str?
      destiny_reset: bool?
      quiet_start: str?
      quiet_end: str?
      max_per_day: int?
      voice: str?
      speaker: str
  providers_enabled:
    - str
  quiet_start: str
  quiet_end: str
  timezone: str
  ingest_url: str
  ingest_token: password
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password?
  enable_scheduler: bool
  signing_key: password?
  outbox_token: password
  assistant_url: str?
  assistant_token: password?
  bungie_api_key: password
  destiny_poll_s: int(60,86400)
  admin_token: password?
  arc_data_dir: str?
  destiny_reset_utc_hour: int(0,23)?
  todo_entity: str?
  todo_sync: bool?
