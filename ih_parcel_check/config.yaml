name: "Intelligent Home - Parcel check"
version: "0.2.0"
slug: ih_parcel_check
image: "ghcr.io/jarvichi/{arch}-ih_parcel_check"
description: "Looks at saved doorstep pictures through the Intelligent Home AI layer (capability vision) and says whether a parcel was left. DRY by default: it only writes verdicts to its own log and posts nothing. The AI layer decides which provider sees the picture; if that is an outside one (Gemini), the picture leaves the house."
arch:
  - aarch64
startup: application
boot: manual
init: false
watchdog: "http://[HOST]:[PORT:8816]/healthz"
map:
  - type: media
    read_only: true
ports:
  8816/tcp: 8816
ports_description:
  8816/tcp: "Health and status (/healthz, /status)"
options:
  dry: true
  snapshot_dir: "/media/eufy_snapshots"
  cameras: "front_door,side_door"
  ai_layer_url: "http://172.30.32.1:8801"
  api_token: ""
  poll_seconds: 30
  recheck_after_seconds: 120
  timeout_seconds: 300
schema:
  dry: bool
  snapshot_dir: str
  cameras: str
  ai_layer_url: str
  api_token: password
  poll_seconds: int(10,600)
  recheck_after_seconds: int(0,900)
  timeout_seconds: int(30,900)
