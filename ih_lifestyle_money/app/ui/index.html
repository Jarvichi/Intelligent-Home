<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Money</title><link rel="stylesheet" href="ih-ui.css"><link rel="stylesheet" href="ui.css"></head><body>
<ih-nav data-home-href="/app/32c8114c_ih_orchestrator" data-title="Money"></ih-nav><ih-app><main>
<header class="heading"><div><h1>Money</h1><p>Keep track of your contracts and payments.</p></div><button id="add" class="primary" type="button">Add contract</button></header>
<nav class="tabs" aria-label="Money sections"><button data-tab="leases" aria-selected="true">Leases</button><button data-tab="insurance" aria-selected="false">Insurance</button><button data-tab="loans" aria-selected="false">Loans</button><button data-tab="other" aria-selected="false">Other</button></nav>
<p id="status" role="status" aria-live="polite"></p><section id="list" aria-label="Contracts"></section>
<section id="editor" class="card" hidden><div class="cardhead"><h2 id="edit-title">Add contract</h2><button type="button" id="close">Close</button></div><p>Keep the dates and payment details together.</p><form id="form"><div class="grid">
<label>Name<input name="name" maxlength="160" required></label><label>Type<input name="kind" list="types" required><datalist id="types"><option value="car lease"><option value="other lease"><option value="house insurance"><option value="car insurance"><option value="pet insurance"><option value="holiday insurance"><option value="loan"><option value="mortgage"><option value="other contract"></datalist></label>
<label>Start date<input name="start" type="date"></label><label>End or renewal date<input name="end" type="date"></label><label>Monthly payment (£)<input name="monthly_payment" type="number" min="0.01" step="0.01"></label><label>Payment day<input name="payment_day" type="number" min="1" max="31" step="1"></label><label>Recorded balance (£)<input name="balance" type="number" min="0" step="0.01"></label><label>Balance date<input name="balance_date" type="text" placeholder="YYYY-MM-DD; loans may use YYYY-MM"></label><label>Early settlement quote (£)<input name="settlement" type="number" min="0" step="0.01"></label><label>Quote date<input name="settlement_date" type="date"></label></div>
<fieldset><legend>Reminders</legend><label>Months before the end date<input name="remind_months" placeholder="For example: 6, 3" inputmode="numeric"></label><p class="muted">Leave blank to use the usual timing for this contract type.</p><div>Send reminders to</div><div id="recipients" class="recipient-list"></div><p class="muted" id="recipient-help"></p></fieldset><div class="actions"><button class="primary" type="submit">Save contract</button><button type="button" id="cancel">Cancel</button></div><p id="form-status" role="status" aria-live="polite"></p></form></section>
</main></ih-app><script src="ih-ui.js"></script><script src="ui.js"></script></body></html>
