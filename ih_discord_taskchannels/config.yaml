name: "Intelligent Home - Discord - Task channels"
version: "0.1.3"
slug: ih_discord_taskchannels
image: "ghcr.io/jarvichi/{arch}-ih_discord_taskchannels"
description: "One private Discord channel per task, as a module of the ih_discord transport: commands new / done / reopen / list in a commands channel, goal as channel topic, Work in Progress and Done categories, daily cleanup of old done channels. It asks the transport (signed MQTT bus) to administer channels and never holds a Discord token. SHADOW mode by default: it creates nothing. No Home Assistant access. Maps no folders."
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
ports:
  8797/tcp: 8797
ports_description:
  8797/tcp: "Health and status (/healthz, /status)"
options:
  log_payloads: false
  module_name: "ih_discord_taskchannels"
  signing_key: ""
  shadow: true
  command_channel_key: "tasks"
  wip_category: "wip"
  done_category: "done"
  template: ""
  cleanup_days: 30
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: "ih_discord_taskchannels"
  mqtt_password: ""
  ingest_url: "http://172.30.32.1:8790"
  ingest_token: ""
schema:
  log_payloads: bool?
  module_name: str
  signing_key: password
  shadow: bool
  command_channel_key: str
  wip_category: str
  done_category: str
  template: str?
  cleanup_days: int(1,365)
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  ingest_url: str
  ingest_token: password
