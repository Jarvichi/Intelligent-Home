<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Intelligent Home</title>
<link rel="stylesheet" href="ih-ui.css?v=nav1">
<style>
:root{--bg:var(--ih-bg);--surface:var(--ih-surface);--raised:var(--ih-surface-raised);--text:var(--ih-text);--muted:var(--ih-muted);--line:var(--ih-line);--ok:var(--ih-ok);--warn:var(--ih-warn);--danger:var(--ih-danger);--accent:var(--ih-accent);--ink:var(--ih-accent-ink);--link:var(--ih-link);--shadow:var(--ih-shadow)}

.page{max-width:1100px;margin:auto;padding:16px;display:grid;gap:12px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;min-height:32px;font-size:14px;font-weight:600;white-space:nowrap;color:var(--muted)}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--danger)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}.dot.warn{background:var(--warn)}.dot.bad{background:var(--danger)}.dot.off{background:var(--muted)}
.pill .dot{background:currentColor}
.lede{margin:0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:16px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.meta{color:var(--muted);font-size:13px;margin:0}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;position:sticky;top:var(--ih-nav-h,48px);z-index:5}
.tab{min-height:44px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;border-radius:10px;padding:0 2px;cursor:pointer;min-width:0}
.tab[aria-selected=true]{background:var(--accent);color:var(--ink)}
.tab:focus-visible,.btn:focus-visible,.disc:focus-visible,select:focus-visible,input:focus-visible,.sel:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.btn{min-height:44px;border:1px solid var(--line);background:var(--raised);color:var(--text);border-radius:8px;padding:0 14px;font:inherit;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--ink);border-color:transparent;font-weight:600}
.btn.danger{color:var(--danger)}
.btn.armed{border-color:var(--warn);color:var(--warn);font-weight:600}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tiles+.btn{margin-top:12px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--raised);border-radius:12px;padding:12px;min-width:0}
.tile b{display:block;font-size:26px;letter-spacing:-.03em;line-height:1.1;overflow-wrap:anywhere}.tile span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;max-width:100%;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--link);font-weight:600;font-size:14px;text-decoration:none;overflow-wrap:anywhere}
.chip:hover{border-color:var(--link)}.chip:focus-visible{outline:3px solid var(--link);outline-offset:2px}.chip.off{color:var(--muted);font-weight:500}
.tile.warn b{color:var(--warn)}.tile.bad b{color:var(--danger)}.tile.ok b{color:var(--ok)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end;margin:0 0 8px}
.toolbar label{display:grid;gap:4px;font-size:12px;color:var(--muted);flex:1 1 150px;min-width:0}
.toolbar input,.toolbar select{min-height:44px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;font-size:15px}
.count{margin:0 0 4px;font-size:13px;color:var(--muted)}
.list{display:grid;gap:8px}
@media(min-width:900px){.list.two{grid-template-columns:1fr 1fr;align-items:start}}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
.disc{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;width:100%;min-height:56px;background:transparent;color:var(--text);border:0;padding:10px 14px;font:inherit;text-align:left;cursor:pointer}
.disc .t{font-weight:600;overflow-wrap:anywhere;min-width:0}.disc .s{grid-column:2;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.disc .chev{grid-row:1/3;grid-column:3;color:var(--link);font-size:22px;line-height:1}
.disc .dot{grid-row:1/3}
.item .body{padding:0 14px 14px;border-top:1px solid var(--line)}
.item.open .chev{transform:rotate(180deg)}
.tag{display:inline-block;font-size:12px;font-weight:500;border-radius:99px;padding:1px 8px;background:var(--raised);color:var(--muted);margin-right:4px}
.tag.warn{color:var(--warn)}.tag.bad{color:var(--danger)}.tag.ok{color:var(--ok)}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:12px 0 0;font-size:14px}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;text-align:right;overflow-wrap:anywhere;min-width:0}
dd.warn{color:var(--warn)}dd.bad{color:var(--danger)}dd.ok{color:var(--ok)}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);min-height:44px}
.row:first-child{border-top:0}.row .grow{flex:1;min-width:0}.row b{display:block;overflow-wrap:anywhere}.row span.m{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.bar{height:6px;border-radius:3px;background:var(--raised);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.days{display:inline-flex;align-items:flex-end;gap:2px;height:22px;margin-top:6px}.days i{display:inline-block;width:8px;background:var(--link);min-height:2px}.days i.z{background:var(--raised)}
.scroll{max-height:340px;overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;padding:6px;background:var(--bg)}
.scroll.tall{max-height:520px}
.hidden,[hidden]{display:none!important}
.sel{display:block;width:100%;text-align:left;min-height:56px;margin:0 0 6px;padding:8px 12px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;font:inherit;cursor:pointer}
.sel[aria-current=true]{border-color:var(--link);box-shadow:inset 3px 0 var(--link)}
.sel small{display:block;color:var(--muted);overflow-wrap:anywhere}
.mono{font:12px ui-monospace,Menlo,monospace;color:var(--muted);overflow-wrap:anywhere}
.span{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;background:var(--bg);min-width:0}
.span.err{border-color:var(--danger)}
.span .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.span .hd b{overflow-wrap:anywhere;min-width:0}
.sect{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
.cols{display:grid;gap:12px}
@media(min-width:900px){.trace{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:12px;align-items:start}}
.back{display:none}
@media(max-width:899px){.trace.detail .tl{display:none}.trace:not(.detail) .td{display:none}.trace.detail .back{display:inline-flex;align-items:center;margin-bottom:8px}}
.fix{padding:10px 12px;border-radius:12px;background:var(--raised);font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fix .txt{flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
.state{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}
.state.fail{border:1px solid var(--danger);color:var(--text)}
.state.fail b{color:var(--danger)}
.state p{margin:0 0 8px}.state p:last-child{margin:0}
.state.loading:before{content:"";display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--link);border-radius:50%;margin-right:8px;vertical-align:-2px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;max-height:260px;font-size:12px;white-space:pre-wrap;word-break:break-all;margin:12px 0 0}
.report{margin:12px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--raised)}
.report p{margin:4px 0}
.warnt{color:var(--warn)}.badt{color:var(--danger)}.body p,.report p{margin:8px 0 0;font-size:13px}.report p:first-of-type{margin-top:6px}
@media(prefers-reduced-motion:no-preference){.chev{transition:transform .15s}.state.loading:before{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head><body>
<ih-nav data-title="Intelligent Home"></ih-nav>
<div class="page">
 <div class="head"><h1>Intelligent Home</h1><span class="pill" id="pill" role="status"><span class="dot" aria-hidden="true"></span><span id="pilltext">Checking...</span></span></div>

  <button type="button" class="tab" role="tab" id="tab-health" data-t="health">Health</button>
 </div>

</div>
<script src="ih-ui.js?v=nav1"></script>
<script src="manager-logic.js"></script>
<script>
var B=location.pathname.endsWith('/')?location.pathname:location.pathname+'/';
var TABS=['today','addons','jobs','requests','health'],TAB='today',RID=0,SHOWALL=false;
var AQ={q:'',show:'all',sort:'attn'},TQ={q:'',type:'',hide:false,sel:''},HQ={q:'',state:''},OPEN={},ARMED=null,ARMT=null,LASTOK=null,REPAINT=null,SHOWN='';
var SRC={addons:'api/addons',health:'api/health',usage:'api/usage',plugins:'api/plugins',settings:'api/settings',traces:'api/traces'};
var S={},BACKFN=null,WIDE=window.matchMedia('(min-width:900px)');
/* The top bar's back step goes up one level: from a request's detail (phones) to the list, using the page's own Back handler. */
function navSync(){if(!window.IHNav)return;if(BACKFN&&!WIDE.matches)IHNav.setTrail([{label:'Requests',onClick:BACKFN}],'Request details');else IHNav.setTrail([],'Intelligent Home')}
if(WIDE.addEventListener)WIDE.addEventListener('change',navSync);
function U(p){return B+p}
function E(tag,txt,cls){var e=document.createElement(tag);if(txt!==undefined&&txt!==null)e.textContent=txt;if(cls)e.className=cls;return e}
function $(id){return document.getElementById(id)}
function T(x){if(!x)return null;var d=new Date(typeof x=='number'?x*1000:x);return isNaN(d)?String(x):d.toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}

function disarm(clear){if(ARMT){clearTimeout(ARMT);ARMT=null}if(ARMED){var b=ARMED;ARMED=null;if(b.dataset.armed){delete b.dataset.armed;b.textContent=b.dataset.label;b.classList.remove('armed')}if(clear)say('')}}
function ask(b,text,fn){if(b.dataset.armed){disarm(false);fn();return}disarm(false);b.dataset.label=b.textContent;b.dataset.armed='1';b.textContent='Tap again to confirm';b.classList.add('armed');ARMED=b;say(text,btn('Cancel',function(){disarm(true)}));ARMT=setTimeout(function(){disarm(true)},8000)}
document.addEventListener('click',function(e){if(ARMED&&!ARMED.contains(e.target)&&!$('msg').contains(e.target))disarm(true)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ARMED)disarm(true)});
function stateBox(kind,msg,retry,detail){var s=E('div',null,'state '+kind);s.setAttribute('role',kind=='fail'?'alert':'status');if(kind=='fail'){var p=E('p');p.appendChild(E('b',msg));s.appendChild(p);if(detail)s.appendChild(E('p',detail));if(retry)s.appendChild(btn('Try again',retry))}else{s.appendChild(document.createTextNode(msg));if(retry){s.appendChild(document.createTextNode(' '));s.appendChild(btn('Clear filters',retry))}}return s}
/* ---- reading data. A failed read keeps the old data if there is any, and is never shown as empty. */
function load(name){var s=S[name]||(S[name]={state:'idle',data:null,err:null});if(!s.data)s.state='loading';
 return fetch(U(SRC[name]),{cache:'no-store'}).then(function(r){return r.json().then(function(j){return[r.status,j]},function(){return[r.status,{}]})}).then(function(x){
  if(x[0]!==200||(x[1]&&x[1].error))throw Error(x[1]&&x[1].error?String(x[1].error):'Request failed ('+x[0]+')');
  s.data=x[1];s.state='ok';s.err=null;s.stale=false;LASTOK=clock()}).catch(function(e){s.err=String(e&&e.message||e);if(s.data){s.stale=true;s.state='ok'}else s.state='fail'})}
function loadAll(names){return Promise.all(names.map(load)).then(paintHead)}
function ctx(){var c={failed:{}};['addons','health','usage','plugins','settings','traces'].forEach(function(n){var s=S[n];c.failed[n]=!!s&&s.state=='fail';c[n]=s&&s.data?(n=='addons'?s.data.addons:n=='traces'?s.data.traces||[]:s.data):null});return c}
function paintHead(){var c=ctx(),p=IHM.pill(c),el=$('pill');el.className='pill'+(p.tone?' '+p.tone:'');$('pilltext').textContent=p.text;
 var l=$('lede'),stale=Object.keys(S).filter(function(n){return S[n].stale});
 l.textContent=(c.failed.addons&&c.failed.health)?'Cannot reach the Manager data. Nothing below is current.':stale.length?'Could not refresh just now. Showing the last good data'+(LASTOK?' from '+LASTOK:'')+'.':'Manager: your add-ons, jobs and health in one place.'+(LASTOK?' Checked '+LASTOK+'.':'')}
/* ---- Home Assistant navigation without a page load (the HA phone app treats link taps in the panel frame as navigation). */
function goHA(path){if(window.IHNav){IHNav.goTop(path);return}try{window.top.history.pushState(null,'',path);window.top.dispatchEvent(new CustomEvent('location-changed',{detail:{replace:false}}))}catch(e){window.top.location.href=path}}
function cfgBtn(full,label){return btn(label||'Settings',function(){goHA(['','config','app',full,'config'].join('/'))})}
function post(path){return fetch(U(path),{method:'POST'}).then(function(r){return r.json().then(function(j){return[r.status,j]})})}
function act(a,s,extra){say(a+' '+s+' ...');post('api/action/'+a+'/'+s+(extra||'')).then(function(x){var c=x[0],j=x[1];
 if(c==202)return poll(j.job);
 if(c==409&&j.warning){if(j.installable&&j.installable.length){say(j.warning,btn('Install those first, then '+s,function(){act(a,s,'?with_requires=1')}));return}say(j.warning+(j.external&&j.external.length?' ('+j.external.join(', ')+' is not ours: install it from the add-on store)':''));return}
 say(j.error||j.warning||('failed '+c))}).catch(function(e){say('error: '+e)})}
function poll(id){fetch(U('api/job/'+id)).then(function(r){return r.json()}).then(function(j){
 say(j.label+': '+j.state+(j.steps&&j.steps.length?' ('+j.steps[j.steps.length-1]+')':'')+(j.error?' ERROR '+j.error:''));
 if(j.state=='queued'||j.state=='running')setTimeout(function(){poll(id)},2000);else reload()}).catch(function(e){say('error: '+e)})}
function reload(){if(TAB=='today'||TAB=='addons'||TAB=='jobs')show(true)}
/* ---- building blocks */
function card(title,sub){var c=E('div',null,'card');if(title)c.appendChild(E('h2',title));if(sub)c.appendChild(E('p',sub,'sub'));return c}
function row(tone,title,detail,action){var r=E('div',null,'row');r.appendChild(E('span',null,'dot'+(tone?' '+tone:'')));var g=E('div',null,'grow');g.appendChild(E('b',title));if(detail)g.appendChild(E('span',detail,'m'));r.appendChild(g);if(action)r.appendChild(action);return r}
function toolbar(){return E('div',null,'toolbar')}
function field(label,control){var l=E('label');l.appendChild(document.createTextNode(label));l.appendChild(control);return l}
function sel(opts,val,fn){var s=E('select');opts.forEach(function(o){var op=E('option',o[1]);op.value=o[0];s.appendChild(op)});s.value=val;s.onchange=function(){fn(s.value)};return s}
function search(ph,val,fn,label){var i=E('input');i.type='search';i.placeholder=ph;i.value=val;i.setAttribute('aria-label',label||ph);i.oninput=function(){fn(i.value)};return i}
var UID=0;
function item(key,tone,titleTxt,tags,subTxt,bodyFn){var it=E('div',null,'item'),id='d'+(++UID);var h=E('button',null,'disc');h.type='button';h.setAttribute('aria-controls',id);h.appendChild(E('span',null,'dot'+(tone?' '+tone:'')));
 var t=E('span',titleTxt,'t');(tags||[]).forEach(function(g){t.appendChild(document.createTextNode(' '));t.appendChild(E('span',g[0],'tag '+(g[1]||'')))});h.appendChild(t);h.appendChild(E('span',subTxt,'s'));var ch=E('span','⌄','chev');ch.setAttribute('aria-hidden','true');h.appendChild(ch);it.appendChild(h);
 var body=null;function open(o){if(o){if(!body){body=E('div',null,'body');body.id=id;bodyFn(body)}it.appendChild(body);body.hidden=false}else if(body)body.hidden=true;it.classList.toggle('open',o);h.setAttribute('aria-expanded',o?'true':'false');if(key)OPEN[key]=o}
 h.onclick=function(){open(!it.classList.contains('open'))};open(!!(key&&OPEN[key]));return it}
function kvl(pairs){var d=E('dl',null,'kv');pairs.forEach(function(p){if(p[1]===null||p[1]===undefined)return;d.appendChild(E('dt',p[0]));d.appendChild(E('dd',String(p[1]),p[2]))});return d}
/* ---- Add-ons */
function healthOf(a){var h=S.health&&S.health.data;if(!h)return{txt:'Not reported',cls:'',checks:[]};if(h.stale)return{txt:'Stale',cls:'warn',checks:[]};
 var c=(h.services||[]).filter(function(s){return s.name==a.slug})[0];if(!c)return{txt:'Not reported',cls:'',checks:[]};return{txt:c.state||'UNKNOWN',cls:c.state=='OK'?'ok':c.state=='FAIL'?'bad':'warn',checks:c.checks||[]}}
function contributionOf(slug){var h=S.health&&S.health.data;return h&&h.ui_contributions?h.ui_contributions.filter(function(v){return v.source==slug})[0]:null}
function reportBlock(c){var p=E('section',null,'report');p.appendChild(E('b','Add-on report'));if(c.stale){p.appendChild(E('p','Report out of date: open the add-on page or check its logs.','warnt'))}else{p.appendChild(E('p',c.summary,c.state=='attention'?'warnt':'meta'));var m=(c.metrics||[]).map(function(x){return[x.label,String(x.value)]});if(c.last_activity_at!=null)m.push(['Last useful work',T(c.last_activity_at)]);if(m.length)p.appendChild(kvl(m));p.appendChild(E('p','Next: '+c.next_step,'meta'))}return p}
function logsToggle(slug,holder){var p=holder.querySelector('pre');if(p){p.remove();return}p=E('pre','loading...');holder.appendChild(p);
 fetch(U('api/logs/'+slug)).then(function(r){return r.json()}).then(function(j){p.textContent=j.error?j.error:(j.lines||[]).join('\n')}).catch(function(){p.textContent='Could not read the logs. Try again.'})}
function addonBody(b,a){var h=healthOf(a),sd=S.settings&&S.settings.data?S.settings.data.addons.filter(function(x){return x.slug==a.slug})[0]:null,con=contributionOf(a.slug);
 if(con)b.appendChild(reportBlock(con));
 var purpose=(a.ui&&a.ui.purpose)||a.description;if(purpose)b.appendChild(E('p',purpose,'meta')).style.marginTop='10px';
 b.appendChild(kvl([['Id',a.slug],['Version',(a.version||'?')+(a.update?' -> update to '+a.latest:' (up to date)'),a.update?'warn':''],['Prebuilt image',IHM.imgTxt(a),a.image?'ok':''],['State',a.state||'-',a.state=='started'?'ok':'bad'],['Health',h.txt,h.cls],
  ['CPU',a.cpu==null?null:a.cpu+' %'],['Memory',a.mem_mb==null?null:a.mem_mb+' MB'],['Last seen',IHM.seenText(a.seen)],['Missing settings',a.missing_settings==null?null:a.missing_settings,a.missing_settings?'warn':''],['Used',IHM.usedTxt(a.used),a.used&&a.used.failed_today?'warn':'']]));
 if(h.checks.length)b.appendChild(E('p','Health: '+h.checks.join('; '),'meta')).style.marginTop='8px';
