name: "Intelligent Home"
version: "0.16.1"
slug: ih_orchestrator
image: "ghcr.io/jarvichi/{arch}-ih_orchestrator"
description: "Status page (modules may push with a source name). The host pushes status to it (POST /ingest, bearer token). Maps no folders, holds no secrets. Secrets broker parked (off). Scheduler (MQTT, messages signed per module with module_keys) off unless enable_scheduler and the mqtt_* options are set."
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
host_network: true
hassio_api: true
hassio_role: manager
ingress: true
ingress_port: 8789
panel_icon: mdi:home-automation
panel_title: Intelligent Home
options:
  log_payloads: false
  ingest_token: ""
  enable_broker: false
  enable_scheduler: false
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  default_timezone: "UTC"
  module_keys: []
  provision: false
  provision_overwrite: false
  provision_interval_min: 10
  shared: []
  fact_clients: []
  watchdog_enabled: true
  watchdog_mode: "dry"
  watchdog_failed_probes: 3
  watchdog_cooldown_minutes: 10
  watchdog_max_restarts_per_hour: 3
  watchdog_never_restart: ""
schema:
  log_payloads: bool?
  ingest_token: password
  enable_broker: bool
  enable_scheduler: bool
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  default_timezone: str
  module_keys:
    - module: str
      key: password
  provision: bool?
  provision_overwrite: bool?
  provision_interval_min: int?
  shared:
    - name: str
      value: password
  fact_clients:
    - module: str
      key: password
      write: bool?
  watchdog_enabled: bool?
  watchdog_mode: list(dry|live)?
  watchdog_interval_seconds: int(10,3600)?
  watchdog_failed_probes: int(1,20)?
  watchdog_cooldown_minutes: int(1,240)?
  watchdog_max_restarts_per_hour: int(1,20)?
  watchdog_never_restart: str?
  tasks_url: str?
  tasks_token: password?
  discord_bot_token: password?
  discord_channel_id: str?
