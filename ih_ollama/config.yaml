name: "Intelligent Home - Ollama"
version: "0.1.0"
slug: ih_ollama
image: "ghcr.io/jarvichi/{arch}-ih_ollama"
description: "A small local AI engine (Ollama) for the other Intelligent Home add-ons: pictures, private text and search without sending anything off the home network. Only other add-ons on this machine can reach it."
arch:
  - aarch64
startup: services
boot: manual
init: false
# The port is reachable by other add-ons (by the host name 32c8114c-ih-ollama) but NOT published on the network: Ollama has no login.
ports:
  11434/tcp: null
ports_description:
  11434/tcp: "Ollama API: add-ons only, not published"
watchdog: "http://[HOST]:[PORT:11434]/"
options:
  models:
    - moondream
  keep_alive: "30s"
  max_loaded_models: 1
  num_parallel: 1
schema:
  models:
    - str
  keep_alive: str
  max_loaded_models: int(1,3)
  num_parallel: int(1,4)
