name: "Intelligent Home - Discord - Shopping"
version: "0.3.2"
slug: ih_discord_shopping
image: "ghcr.io/jarvichi/{arch}-ih_discord_shopping"
description: "Shopping list commands (add items, shop checklist by aisle with tick reactions, got ...) as a module of the ih_discord transport. It talks to the transport over a signed MQTT bus and never holds a Discord token. All details are options. SHADOW mode by default: it answers nothing, it only logs what it would post. Also serves the iPhone shopping Shortcut endpoint (POST /shortcut/<token>, dry by default). Maps no folders."
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
homeassistant_api: true
ingress: true
ingress_port: 8796
panel_title: "Shopping Shortcut"
panel_icon: mdi:cart
panel_admin: true
ports:
  8795/tcp: 8795
ports_description:
  8795/tcp: "Health and status (/healthz, /status) and the iPhone Shortcut endpoint (/shortcut/<token>)"
options:
  log_payloads: false
  module_name: "ih_discord_shopping"
  signing_key: ""
  shadow: true
  channel_key: "shopping"
  house_channel_key: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: "ih_discord_shopping"
  mqtt_password: ""
  ingest_url: "http://172.30.32.1:8790"
  ingest_token: ""
  command_event: "ih_discord_command"
  shopping_list_entity: "todo.shopping_list"
  shortcut_token: ""
  shortcut_dry: true
  shortcut_base_url: ""
  meal_plan_script: ""
  shop_names: ""
  aisles: []
  aisle_order: []
  facts_url: ""
  facts_key: ""
  fresh_aisles:
    - "Meat & fish"
    - "Fruit & veg"
    - "Dairy & chilled"
    - "Bakery"
schema:
  log_payloads: bool?
  module_name: str
  signing_key: password
  shadow: bool
  channel_key: str
  house_channel_key: str?
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  ingest_url: str
  ingest_token: password
  command_event: str?
  shopping_list_entity: str?
  shortcut_token: password?
  shortcut_dry: bool?
  shortcut_base_url: str?
  meal_plan_script: str?
  shop_names: str?
  aisles:
    - name: str
      words: str
  aisle_order:
    - str
  facts_url: str?
  facts_key: password?
  fresh_aisles:
    - str?
