<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Shopping · Intelligent Home</title><link rel="stylesheet" href="ih-ui.css"><script defer src="ih-ui.js"></script><style>main{max-width:720px;margin:auto;padding:clamp(16px,4vw,32px)}.ih-card{padding:24px;background:var(--ih-surface);border:1px solid var(--ih-line);border-radius:var(--ih-radius-panel);box-shadow:var(--ih-shadow)}h1{font-size:clamp(1.8rem,5vw,2.6rem);margin:.25em 0}p{line-height:1.55}input{width:100%;padding:12px;border:1px solid var(--ih-line);border-radius:var(--ih-radius-control);background:var(--ih-bg);color:var(--ih-text);font:inherit}section{margin-bottom:16px}label{display:block;margin:8px 0;color:var(--ih-muted)}li{padding:8px 0;overflow-wrap:anywhere}button{min-height:44px;padding:10px 16px;border:0;border-radius:999px;background:var(--ih-accent);color:var(--ih-accent-ink);font:inherit;font-weight:700}</style><link rel="stylesheet" href="ih-patterns.css"></head><body><main><header><p class="ih-kicker">INTELLIGENT HOME · DISCORD</p><h1>Shopping</h1><p class="ih-muted">Browse the current list and manage Shortcut setup.</p></header><section class="ih-card" aria-labelledby="list-title"><h2 id="list-title">Shopping list</h2><label for="list-search">Search items</label><input id="list-search" type="search"><p id="list-status" role="status">Loading shopping list…</p><ul id="shopping-items"></ul><button id="list-refresh" type="button">Refresh list</button><p class="ih-muted">Read-only view. Manage items through the existing shopping commands.</p></section><section class="ih-card"><h2>Shortcut setup</h2><!--shortcut-content--></section></main><script src="ui.js"></script></body></html>
