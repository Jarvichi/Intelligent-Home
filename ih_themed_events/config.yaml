name: "Intelligent Home - Themed Events"
version: "0.1.10"
slug: ih_themed_events
image: "ghcr.io/jarvichi/{arch}-ih_themed_events"
description: "Themed events (Halloween, New Year's Eve, birthdays, ...) kept as data: date, lights, speakers, sounds folder, automations to pause, effects, auto-off time, a checklist and a review after each run. Plan themed events, review and apply new events from the administrator page when live control is enabled. Own database and token-protected local API."
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
watchdog: "http://[HOST]:[PORT:8819]/healthz"
ingress: true
ingress_port: 8825
panel_title: "IH · Events"
panel_icon: mdi:party-popper
panel_admin: true
homeassistant_api: true
ports:
  8819/tcp: 8819
ports_description:
  8819/tcp: "Themed events API (bearer api_token); /healthz is open"
options:
  api_token: ""
  control: "off"
schema:
  api_token: password
  control: list(off|live)
