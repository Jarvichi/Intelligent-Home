<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Displays</title><link rel="stylesheet" href="ih-ui.css"><link rel="stylesheet" href="ui.css"></head><body><ih-nav data-home-href="/app/32c8114c_ih_orchestrator" data-title="Displays"></ih-nav><ih-app><main><h1>Displays</h1><p>Describe your displays so their apps can use the right layout and refresh settings.</p><p id="status" role="status" aria-live="polite"></p><section class="card"><h2>Your displays</h2><p class="muted">Profiles are settings. They do not show whether a display is connected.</p><div id="profiles"></div></section><section class="card"><h2 id="form-title">Add a display</h2><form id="editor"><div class="grid"><label>Name<input name="name" maxlength="80" required></label><label>Display type<select name="kind"><option value="kindle">Kindle</option><option value="wall">Wall display</option><option value="other">Other display</option></select></label><label>Width in pixels<input name="width" type="number" min="1" max="8192" required></label><label>Height in pixels<input name="height" type="number" min="1" max="8192" required></label><label>Colour<select name="colour"><option value="monochrome">Monochrome</option><option value="grayscale">Greyscale</option><option value="colour">Colour</option></select></label><label>Power<select name="power"><option value="battery">Battery</option><option value="mains">Mains</option><option value="both">Battery and mains</option></select></label><label>Display method<select name="transport"><option value="image">Image</option><option value="web">Web page</option><option value="data">Data</option></select></label><label>Refresh interval in seconds<input name="refresh_seconds" type="number" min="5" max="86400" required></label></div><label class="check"><input name="touch" type="checkbox"> Touch screen</label><div class="actions"><button class="primary" type="submit">Save display</button><button type="button" id="cancel">Clear</button></div></form></section></main></ih-app><script src="ih-ui.js"></script><script src="ui.js"></script></body></html>
