name: "Intelligent Home - Displays"
version: "0.7.0"
slug: ih_displays
image: "ghcr.io/jarvichi/{arch}-ih_displays"
description: "Shared display profiles for Intelligent Home display adapters."
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
homeassistant_api: true
ingress: true
ingress_port: 8827
panel_title: "IH · Displays"
panel_icon: mdi:monitor-dashboard
panel_admin: true
ports:
  8805/tcp: null
ports_description:
  8805/tcp: "Private read-only display profile API"
watchdog: "http://[HOST]:[PORT:8805]/healthz"
options:
  api_token: ""
  message_entities: []
  dishwasher_pending_entity: ""
  dishwasher_finished_entity: ""
  collection_sources: []
  collection_calendar: ""
  free_power_event: ""
  robots: []
  robot_weather_entity: ""
  robot_forecast_entity: ""
  robot_forecast_fallback_entity: ""
  robot_recent_rain_entity: ""
  robot_mower_stored_entity: ""
  health_dns_entity: ""
  health_smoke_entity: ""
  health_backup_entity: ""
  health_forecast_entity: ""
  health_forecast_fallback_entity: ""
  health_disk_entity: ""
  health_temperature_entity: ""
  health_offline_entity: ""
  health_display_seen_entity: ""
  health_display_battery_entity: ""
  health_display_name: "Display"
schema:
  api_token: password?
  message_entities:
    - str
  dishwasher_pending_entity: str?
  dishwasher_finished_entity: str?
  collection_sources:
    - entity: str
      label: str
  collection_calendar: str?
  free_power_event: str?
  robots:
    - name: str
      kind: list(vacuum|mower)
      entity: str
      last_completed: str
      last_active: str?
      error: str?
      last_error: str?
      battery: str?
      blade: str?
  robot_weather_entity: str?
  robot_forecast_entity: str?
  robot_forecast_fallback_entity: str?
  robot_recent_rain_entity: str?
  robot_mower_stored_entity: str?
  health_dns_entity: str?
  health_smoke_entity: str?
  health_backup_entity: str?
  health_forecast_entity: str?
  health_forecast_fallback_entity: str?
  health_disk_entity: str?
  health_temperature_entity: str?
  health_offline_entity: str?
  health_display_seen_entity: str?
  health_display_battery_entity: str?
  health_display_name: str
