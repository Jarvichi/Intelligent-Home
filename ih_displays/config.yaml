name: "Intelligent Home - Displays"
version: "0.12.3"
slug: ih_displays
image: "ghcr.io/jarvichi/{arch}-ih_displays"
description: "Shared display profiles for Intelligent Home display adapters."
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
homeassistant_api: true
ingress: true
ingress_port: 8827
panel_title: "IH · Displays"
panel_icon: mdi:monitor-dashboard
panel_admin: true
ports:
  8805/tcp: null
ports_description:
  8805/tcp: "Private read-only display profile API"
watchdog: "http://[HOST]:[PORT:8805]/healthz"
options:
  api_token: ""
  message_entities: []
  dishwasher_pending_entity: ""
  dishwasher_finished_entity: ""
  collection_sources: []
  collection_calendar: ""
  free_power_event: ""
  energy_provider_name: "Energy"
  booking_status_entity: ""
  wheel_result_entity: ""
  oven_clean_entity: ""
  tomorrow_event_entity: ""
  alerts_enabled: false
  alert_smoke_entities: []
  alert_co_entity: ""
  alert_saving_calendar: ""
  alert_dismissed_entity: ""
  robots: []
  robot_weather_entity: ""
  robot_forecast_entity: ""
  robot_forecast_fallback_entity: ""
  robot_recent_rain_entity: ""
  robot_mower_stored_entity: ""
  health_dns_entity: ""
  health_smoke_entity: ""
  health_backup_entity: ""
  health_forecast_entity: ""
  health_forecast_fallback_entity: ""
  health_disk_entity: ""
  health_temperature_entity: ""
  health_offline_entity: ""
  health_display_seen_entity: ""
  health_display_battery_entity: ""
  health_display_name: "Display"
  battery_enabled: false
  battery_forecast_entity: ""
  battery_ignored_entity: ""
  battery_exclude_tokens: []
  battery_models: []
  battery_device_overrides: []
  maintenance_groups: []
schema:
  api_token: password?
  message_entities:
    - str
  dishwasher_pending_entity: str?
  dishwasher_finished_entity: str?
  collection_sources:
    - entity: str
      label: str
  collection_calendar: str?
  free_power_event: str?
  energy_provider_name: str
  booking_status_entity: str?
  wheel_result_entity: str?
  oven_clean_entity: str?
  tomorrow_event_entity: str?
  alerts_enabled: bool
  alert_smoke_entities:
    - str
  alert_co_entity: str?
  alert_saving_calendar: str?
  alert_dismissed_entity: str?
  robots:
    - name: str
      kind: list(vacuum|mower)
      entity: str
      last_completed: str
      last_active: str?
      error: str?
      last_error: str?
      battery: str?
      blade: str?
  robot_weather_entity: str?
  robot_forecast_entity: str?
  robot_forecast_fallback_entity: str?
  robot_recent_rain_entity: str?
  robot_mower_stored_entity: str?
  health_dns_entity: str?
  health_smoke_entity: str?
  health_backup_entity: str?
  health_forecast_entity: str?
  health_forecast_fallback_entity: str?
  health_disk_entity: str?
  health_temperature_entity: str?
  health_offline_entity: str?
  health_display_seen_entity: str?
  health_display_battery_entity: str?
  health_display_name: str
  battery_enabled: bool
  battery_forecast_entity: str?
  battery_ignored_entity: str?
  battery_exclude_tokens:
    - str
  battery_models:
    - model: str
      type: str
  battery_device_overrides:
    - device_id: str
      name: str?
      type: str?
  maintenance_groups:
    - name: str
      kind: list(vacuum|mower)
      stored_entity: str?
      parts:
        - entity: str
          label: str
          threshold: int
