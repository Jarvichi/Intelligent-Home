name: "Intelligent Home - AI Layer"
version: "0.4.17"
slug: ih_ai_layer
image: "ghcr.io/jarvichi/{arch}-ih_ai_layer"
description: "Routes an AI request (text + optional capability) to an AI provider and returns the answer. Providers (Gemini, Groq, OpenRouter, Mistral, OpenAI, Pollinations, SerpApi, Serper, Grok, Claude) run inside this add-on; separate agent add-ons can still register with a signed registration (register_key). Remembers which answers best per capability. NOT connected to Discord or any chat. SHADOW mode by default: nothing is called. No Home Assistant access. Maps no folders."
arch:
  - aarch64
  - amd64
startup: application
# boot: manual = start it yourself (the default here). To start with Home Assistant, set boot: auto (Supervisor option "Start on boot").
# After install the owner sets: boot auto, watchdog on, auto_update on.
# watchdog: add  watchdog: http://[HOST]:[PORT:8801]/healthz  once boot is auto; the Supervisor then restarts the add-on if /healthz stops answering.
boot: manual
init: false
ingress: true
ingress_port: 8811
panel_title: "IH · AI Layer"
panel_icon: mdi:home-circle
panel_admin: true
ports:
  8801/tcp: 8801
ports_description:
  8801/tcp: "AI request API (token) plus /healthz"
options:
  api_token: ""
  games_art_token: ""
  register_key: ""
  shadow: true
  agent_timeout_s: 20
  rate_per_min: 30
  max_tries: 2
  log_payloads: false
  providers: []
  gemini_key: ""
  groq_key: ""
  openrouter_key: ""
  mistral_key: ""
  openai_key: ""
  pollinations_key: ""
  serpapi_key: ""
  serper_key: ""
  xai_key: ""
  anthropic_key: ""
schema:
  api_token: password
  games_art_token: password?
  register_key: password
  shadow: bool
  agent_timeout_s: int(1,60)
  rate_per_min: int(1,600)
  max_tries: int(1,5)
  log_payloads: bool?
  providers:
    - name: list(gemini|groq|openrouter|mistral|openai|pollinations|serpapi|serper|grok|claude|publicapis|mcp)
      enabled: bool
      key: password?
      model: str?
      settings: str?
  gemini_key: password?
  groq_key: password?
  openrouter_key: password?
  mistral_key: password?
  openai_key: password?
  pollinations_key: password?
  serpapi_key: password?
  serper_key: password?
  xai_key: password?
  anthropic_key: password?
