name: "Intelligent Home - AI Layer"
version: "0.2.1"
slug: ih_ai_layer
description: "Routes an AI request (text + optional capability) to a registered AI agent add-on and returns the answer. Remembers which agent answers best per capability. NOT connected to Discord or any chat. Agents join with a signed registration (register_key). SHADOW mode by default: agents are not called. No Home Assistant access. Maps no folders."
arch:
  - aarch64
  - amd64
startup: application
# boot: manual = start it yourself (the default here). To start with Home Assistant, set boot: auto (Supervisor option "Start on boot").
# After install the owner sets: boot auto, watchdog on, auto_update on.
# watchdog: add  watchdog: http://[HOST]:[PORT:8801]/healthz  once boot is auto; the Supervisor then restarts the add-on if /healthz stops answering.
boot: manual
init: false
ports:
  8801/tcp: 8801
ports_description:
  8801/tcp: "AI request API (token) plus /healthz"
options:
  api_token: ""
  register_key: ""
  shadow: true
  agent_timeout_s: 20
  rate_per_min: 30
  max_tries: 2
  log_payloads: false
schema:
  api_token: password
  register_key: password
  shadow: bool
  agent_timeout_s: int(1,60)
  rate_per_min: int(1,600)
  max_tries: int(1,5)
  log_payloads: bool?
