<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Speaker</title><link rel="stylesheet" href="ih-ui.css"><link rel="stylesheet" href="ui.css"></head><body>
<ih-nav data-home-href="/app/32c8114c_ih_orchestrator" data-title="Speaker"></ih-nav><ih-app><main>
<header class="heading"><div><h1>Speaker clips</h1><p>Every message that is spoken is kept here, so the next time it plays at once.</p></div></header>
<p id="mode" class="muted" role="status"></p>
<section class="card" aria-labelledby="new-h"><h2 id="new-h">New message</h2>
<form id="gen"><div class="grid"><label class="wide">Message<textarea name="text" rows="2" maxlength="600" required></textarea></label>
<label>Voice<select name="voice" id="gen-voice"></select></label><label>Label (optional)<input name="label" maxlength="60" placeholder="For example: one moment"></label>
<label>Play on<select name="speaker" id="gen-speaker"></select></label></div>
<div class="actions"><button class="primary" type="submit" data-act="save">Generate and save</button><button type="submit" data-act="play">Generate and play</button></div></form>
<p id="gen-status" role="status" aria-live="polite"></p></section>
<section class="card" aria-labelledby="list-h"><div class="cardhead"><h2 id="list-h">Saved clips</h2><span id="stats" class="muted"></span></div>
<div class="filters"><label>Search<input id="q" type="search" placeholder="Words or label"></label><label>Voice<select id="f-voice"><option value="*">All voices</option></select></label><label>Engine<select id="f-engine"><option value="">All engines</option></select></label><label>Play on<select id="speaker"></select></label><button id="clear" type="button">Clear</button></div>
<p id="status" role="status" aria-live="polite"></p>
<div class="tablewrap"><table><thead><tr><th>Message</th><th>Voice</th><th>Size</th><th>Used</th><th>Last used</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
<p id="empty" class="empty" hidden>No clips match.</p></section>
</main></ih-app><script src="ih-ui.js"></script><script src="ui.js"></script></body></html>
