name: "Intelligent Home - Speaker"
version: "0.4.3"
slug: ih_speaker
image: "ghcr.io/jarvichi/{arch}-ih_speaker"
description: "Text-to-speech tool for the house speakers with a clip cache and an admin page (can also send the clip as a Discord voice message). Other add-ons send it a message and it speaks it (voice, volume with restore, one message at a time, skip if the speaker is playing, quiet-hour and per-persona rules). It never writes a message. DRY-RUN by default."
arch:
  - aarch64
  - amd64
startup: application
# boot: manual = start it yourself. After install the owner sets: boot auto, watchdog on, auto_update on.
# watchdog: add  watchdog: http://[HOST]:[PORT:8831]/healthz  once boot is auto.
boot: manual
init: false
ingress: true
ingress_port: 8832
panel_title: "IH · Speaker"
panel_icon: mdi:speaker-wireless
panel_admin: true
backup_exclude:
  - /data/cache
homeassistant_api: true
ports:
  8831/tcp: 8831
ports_description:
  8831/tcp: "Speak API (bearer api_token); /healthz is open"
options:
  mode: "dry"
  api_token: ""
  timezone: "Europe/London"
  default_volume: 0.2
  quiet_start: "00:00"
  quiet_end: "07:00"
  night_start: "22:00"
  alert_personas: []
  speakers: []
  voices: []
  permissions: []
  night_deny: []
  keep_volume_speakers: []
  discord_token: ""
  discord_users: []
  discord_permissions: []
  engines:
    - "tts.piper"
    - "tts.kokoro"
  queue_max: 5
  queue_ttl_s: 120
  cache_mb: 1024
  cache_days: 30
  base_url: ""
  seed_fillers: true
  auto_pin_uses: 5
  auto_pin_days: 30
schema:
  mode: list(dry|live)
  api_token: password
  timezone: str
  default_volume: float(0,1)
  quiet_start: str
  quiet_end: str
  night_start: str
  alert_personas:
    - str?
  speakers:
    - str?
  voices:
    - str?
  permissions:
    - str?
  night_deny:
    - str?
  keep_volume_speakers:
    - str?
  discord_token: password?
  discord_users:
    - str?
  discord_permissions:
    - str?
  engines:
    - str?
  queue_max: int(1,20)
  queue_ttl_s: int(1,900)
  cache_mb: int(1,100000)
  cache_days: int(1,3650)
  base_url: str?
  seed_fillers: bool
  auto_pin_uses: int(0,1000)
  auto_pin_days: int(1,3650)
