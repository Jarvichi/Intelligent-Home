name: "Intelligent Home - Speaker"
version: "0.1.0"
slug: ih_speaker
image: "ghcr.io/jarvichi/{arch}-ih_speaker"
description: "Text-to-speech tool for the house speakers. Other add-ons send it a message and it speaks it (voice, volume with restore, one message at a time, skip if the speaker is playing, quiet-hour and per-persona rules). It never writes a message. DRY-RUN by default."
arch:
  - aarch64
  - amd64
startup: application
# boot: manual = start it yourself. After install the owner sets: boot auto, watchdog on, auto_update on.
# watchdog: add  watchdog: http://[HOST]:[PORT:8831]/healthz  once boot is auto.
boot: manual
init: false
homeassistant_api: true
ports:
  8831/tcp: 8831
ports_description:
  8831/tcp: "Speak API (bearer api_token); /healthz is open"
options:
  mode: "dry"
  api_token: ""
  timezone: "Europe/London"
  default_volume: 0.2
  quiet_start: "00:00"
  quiet_end: "07:00"
  night_start: "22:00"
  alert_personas: []
  speakers: []
  voices: []
  permissions: []
  night_deny: []
  keep_volume_speakers: []
  engines:
    - "tts.piper"
    - "tts.kokoro"
  queue_max: 5
  queue_ttl_s: 120
schema:
  mode: list(dry|live)
  api_token: password
  timezone: str
  default_volume: float(0,1)
  quiet_start: str
  quiet_end: str
  night_start: str
  alert_personas:
    - str?
  speakers:
    - str?
  voices:
    - str?
  permissions:
    - str?
  night_deny:
    - str?
  keep_volume_speakers:
    - str?
  engines:
    - str?
  queue_max: int(1,20)
  queue_ttl_s: int(1,900)
