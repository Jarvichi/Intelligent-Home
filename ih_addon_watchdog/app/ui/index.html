<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add-on Watchdog</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1c1c1e;--mut:#6b7280;--line:#d9dde3;--ok:#157f3b;--bad:#b42318;--warn:#b54708;--card:#f6f7f9}
@media(prefers-color-scheme:dark){:root{--bg:#161719;--fg:#ececec;--mut:#9aa0a8;--line:#33363b;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--card:#202226}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:24px 0 8px}.mut{color:var(--mut)}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}
.pill{padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.dry{color:var(--warn)}.live{color:var(--bad)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}
button,input,select{font:inherit}button{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
details{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;background:var(--card)}summary{cursor:pointer}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:300px;overflow:auto;margin:8px 0 0}
input[type=search]{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-width:200px}
</style></head><body>
<h1>Add-on Watchdog</h1><div class="mut" id="sub">Loading...</div>
<div class="bar"><span>Mode: <b id="mode" class="pill"></b></span><button id="swap"></button><input type="search" id="q" placeholder="Search add-ons"><button id="clr">Clear</button></div>
<h2>Health</h2><div class="tw"><table><thead><tr><th>Add-on</th><th>State</th><th>Last probe</th><th>Restarts today</th><th>Watch</th></tr></thead><tbody id="rows"></tbody></table></div>
<h2>Recent incidents</h2><div id="inc" class="mut">None yet.</div>
<script>
const $=id=>document.getElementById(id);let D=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when=t=>t?new Date(t*1000).toLocaleString():'-';
async function post(p,b){await fetch('api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});load()}
function draw(){
 const q=$('q').value.toLowerCase();
 $('mode').textContent=D.mode.toUpperCase();$('mode').className='pill '+D.mode;
 $('swap').textContent=D.mode=='dry'?'Go LIVE':'Back to DRY';
 $('sub').textContent='Last check '+when(D.last_cycle)+(D.error?' - error: '+D.error:'')+(D.mode=='dry'?' - DRY: nothing is restarted':'');
 $('rows').innerHTML=D.rows.filter(r=>(r.name+r.slug).toLowerCase().includes(q)).map(r=>`<tr><td>${esc(r.name)}<div class="mut">${esc(r.slug)}</div></td><td class="${r.state=='started'?'ok':'bad'}">${esc(r.state)}</td><td class="${r.fails?'bad':''}">${esc(r.probe)}<div class="mut">${when(r.last_probe)}${r.fails?' - '+r.fails+' failed':''}</div></td><td>${r.restarts_today}</td><td><label><input type="checkbox" data-s="${esc(r.slug)}" ${r.enabled?'checked':''}> on</label></td></tr>`).join('')||'<tr><td colspan=5 class="mut">No add-ons match.</td></tr>';
 document.querySelectorAll('input[data-s]').forEach(c=>c.onchange=()=>post('toggle',{slug:c.dataset.s,enabled:c.checked}));
 $('inc').innerHTML=D.incidents.length?D.incidents.map(i=>`<details><summary>${when(i.at)} - <b>${esc(i.name)}</b> - ${esc(i.action)}${i.dry?' <span class="dry">(DRY)</span>':''}${i.task?' - task #'+i.task:''}</summary><div class="mut">${esc(i.probe)}</div><pre>${esc(i.excerpt)}</pre></details>`).join(''):'None yet.';
}
async function load(){try{D=await (await fetch('api/state')).json();draw()}catch(e){$('sub').textContent='Cannot reach the add-on'}}
$('swap').onclick=()=>{if(D.mode=='dry'&&!confirm('Go LIVE? The watchdog will restart add-ons.'))return;post('mode',{mode:D.mode=='dry'?'live':'dry'})};
$('q').oninput=()=>D&&draw();$('clr').onclick=()=>{$('q').value='';D&&draw()};
load();setInterval(load,15000);
</script></body></html>
