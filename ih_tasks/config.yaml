name: "Intelligent Home - Tasks"
version: "0.10.16"
slug: ih_tasks
image: "ghcr.io/jarvichi/{arch}-ih_tasks"
description: "One list of tasks with clear stages (To do, Planning, Approved, Implementing, Verifying, Done, Closed with a reason). A worker writes the plan; only the owner approves it. Questions are a flag on the task, answers carry on the same task, and every change is kept in the task's history. Own database, token-protected local API, board page. Changes nothing outside itself unless the to-do list mirror is turned on."
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
watchdog: "http://[HOST]:[PORT:8818]/healthz"
ingress: true
ingress_port: 8823
panel_title: "IH · Tasks"
panel_icon: mdi:view-column-outline
panel_admin: true
homeassistant_api: true
ports:
  8818/tcp: 8818
ports_description:
  8818/tcp: "Tasks API (bearer api_token or owner_token); /healthz is open"
options:
  api_token: ""
  owner_token: ""
  mirror: "off"
  mirror_entity: ""
  mirror_minutes: 5
  inbox_url: "http://32c8114c-ih-orchestration-inbox:8800"
  inbox_token: ""
  reminder_hour: 8
schema:
  api_token: password
  owner_token: password?
  mirror: list(off|dry|live)
  mirror_entity: str?
  mirror_minutes: int(1,120)
  inbox_url: str?
  inbox_token: password?
  reminder_hour: int(0,23)
