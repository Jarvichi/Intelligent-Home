name: "Intelligent Home - Assets"
version: "0.2.2"
slug: ih_assets
image: "ghcr.io/jarvichi/{arch}-ih_assets"
description: "Things you own (games, DVDs, toys, devices, books) with a low and high resale value each, total tiles and a low/high value-over-time chart. Own database, token-protected local API and an admin page. Publishes sensor.assets_low and sensor.assets_high only when mode is live."
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
watchdog: "http://[HOST]:[PORT:8852]/healthz"
ingress: true
ingress_port: 8853
panel_title: "IH · Assets"
panel_icon: mdi:treasure-chest
panel_admin: true
homeassistant_api: true
ports:
  8852/tcp: 8852
ports_description:
  8852/tcp: "Assets API (bearer api_token); /healthz is open"
options:
  mode: "dry"
  api_token: ""
  interval_min: 60
schema:
  mode: list(dry|live)
  api_token: password
  interval_min: int(5,1440)
