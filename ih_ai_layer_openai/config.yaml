name: "Intelligent Home - AI Layer - OpenAI"
version: "0.1.1"
slug: ih_ai_layer_openai
description: "Agent of Intelligent Home - AI Layer. Answers general questions and summarizes text through OpenAI (Responses API, your own key, daily cap; spend cap 0 = no paid calls). Text is scrubbed of personal data before it leaves the house. Registers with the parent. No Home Assistant access. Maps no folders."
arch:
  - aarch64
  - amd64
startup: application
# boot: manual = start it yourself (the default here). To start with Home Assistant, set boot: auto (Supervisor option "Start on boot").
# After install the owner sets: boot auto, watchdog on, auto_update on.
# watchdog: add  watchdog: http://[HOST]:[PORT:8811]/healthz  once boot is auto; the Supervisor then restarts the add-on if /healthz stops answering.
boot: manual
init: false
ports:
  8811/tcp: 8811
ports_description:
  8811/tcp: "Signed /ask from the parent, plus /healthz and /status"
options:
  openai_key: ""
  register_key: ""
  parent_url: "http://172.30.32.1:8801"
  callback_url: ""
  model: "gpt-6-luna"
  spend_cap: 0
  free_tier: false
  daily_cap: 50
  timeout_s: 30
  shadow: true
  max_chars: 1900
schema:
  openai_key: password
  register_key: password
  parent_url: str
  callback_url: str?
  model: str
  spend_cap: int(0,1000)
  free_tier: bool
  daily_cap: int(0,1000)
  timeout_s: int(5,120)
  shadow: bool
  max_chars: int(100,4000)
