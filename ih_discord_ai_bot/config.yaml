name: "Intelligent Home - Discord - AI Bot"
version: "0.1.2"
slug: ih_discord_ai_bot
image: "ghcr.io/jarvichi/{arch}-ih_discord_ai_bot"
description: "Answers messages on chosen Discord channel keys with the Intelligent Home AI layer, as a module of the ih_discord transport. It sends the text of an allow-listed user's message to the AI layer over its local API and posts the reply back through the transport. It holds no Discord token and no AI key. SHADOW mode by default: it logs what it would post and posts nothing. Maps no folders."
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
# After install the owner sets: boot auto, watchdog on, auto_update on.
# watchdog: add  watchdog: http://[HOST]:[PORT:8803]/healthz  once boot is auto.
ports:
  8803/tcp: 8803
ports_description:
  8803/tcp: "Health and status (/healthz, /status)"
options:
  log_payloads: false
  module_name: "ih_discord_ai_bot"
  signing_key: ""
  shadow: true
  channel_keys: []
  channels_list: ""
  trigger_prefix: ""
  allowed_user_ids: []
  ai_layer_url: "http://172.30.32.1:8801"
  api_token: ""
  capability: ""
  rate_per_min: 6
  max_age_s: 300
  ai_timeout_s: 60
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: "ih_discord_ai_bot"
  mqtt_password: ""
  ingest_url: "http://172.30.32.1:8790"
  ingest_token: ""
schema:
  log_payloads: bool?
  module_name: str
  signing_key: password
  shadow: bool
  channel_keys:
    - str
  channels_list: str?
  trigger_prefix: str?
  allowed_user_ids:
    - str
  ai_layer_url: str
  api_token: password
  capability: str?
  rate_per_min: int(1,60)
  max_age_s: int(10,3600)
  ai_timeout_s: int(5,120)
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  ingest_url: str
  ingest_token: password
