name: "Intelligent Home - Kindle Display"
version: "0.15.16"
slug: ih_display_kindle
image: "ghcr.io/jarvichi/{arch}-ih_display_kindle"
description: "Preview an existing Kindle display picture."
arch:
  - aarch64
  - amd64
startup: application
map:
  - addon_config:rw
boot: manual
init: true
homeassistant_api: true
ingress: true
ingress_port: 8840
panel_title: "IH · Kindle Display"
panel_icon: mdi:tablet-dashboard
panel_admin: true
ports:
  8841/tcp: null
ports_description:
  8841/tcp: "Health endpoint, not published"
watchdog: "http://[HOST]:[PORT:8841]/healthz"
options:
  source_url: ""
  cooking_url: ""
  cooking_token: ""
  displays_url: ""
  displays_token: ""
  render_shared_messages: false
  render_shared_alerts: false
  renderer: svg
  device_enabled: false
  device_token: ""
schema:
  source_url: str?
  cooking_url: str?
  cooking_token: password?
  displays_url: str?
  displays_token: password?
  render_shared_messages: bool
  render_shared_alerts: bool
  renderer: list(svg|html)
  device_enabled: bool
  device_token: password?
