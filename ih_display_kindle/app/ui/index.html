<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Kindle Display</title><link rel="stylesheet" href="ih-ui.css"><link rel="stylesheet" href="ui.css"></head><body><ih-nav data-home-href="/app/32c8114c_ih_orchestrator" data-title="Kindle Display"></ih-nav><ih-app><main><h1>Kindle Display</h1><p>Compare the current picture with a read-only replacement preview.</p><section class="card"><label for="source-file">Import a display source mapping</label> <input id="source-file" type="file" accept="application/json,.json"> <button id="import-sources" type="button">Import</button><p id="import-status" role="status"></p></section><section class="card"><label for="screen">Picture</label> <select id="screen"><option value="main">Main display</option><option value="dinner">Dinner menu</option><option value="home">Who’s home</option><option value="birthdays">Birthdays</option></select> <button id="previous-page" type="button">Previous</button> <button id="next-page" type="button">Next</button></section><div class="previews"><section class="card"><div class="heading"><h2>Current picture</h2><button id="refresh" type="button">Refresh</button></div><p id="status" role="status" aria-live="polite">Checking the picture…</p><img id="frame" alt="Current Kindle display picture" hidden></section><section class="card"><h2>New display preview</h2><p id="render-status" role="status">Loading the preview…</p><img id="render" alt="New Kindle display preview" hidden></section></div><p>The preview is read-only. The Kindle still uses its current picture and touch controls.</p></main></ih-app><script src="ih-ui.js"></script><script src="ui.js"></script></body></html>
