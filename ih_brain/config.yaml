name: "Intelligent Home - Brain"
version: "0.5.1"
slug: ih_brain
image: "ghcr.io/jarvichi/{arch}-ih_brain"
description: "Serves House Brain notes to Claude over MCP and provides an admin-only ingress UI to browse, search and read notes. Optional admin-only instructions editor (off by default)."
arch:
  - aarch64
  - amd64
startup: application
# boot: manual = start it yourself. After install the owner sets: boot auto, watchdog on, auto_update on.
# watchdog: add  watchdog: http://[HOST]:[PORT:8820]/healthz  once boot is auto.
boot: manual
init: false
homeassistant_api: true   # only used by the Codex to-do tools (todo.claude_to_do), see DOCS
ingress: true
ingress_port: 8821
panel_title: "Brain"
panel_icon: mdi:brain
panel_admin: true
# The instructions editor (instructions_mode, off by default) reads and writes only /share/agents/agents.md, inside the share folder.
map:
  - share:rw
ports:
  8820/tcp: 8820
ports_description:
  8820/tcp: "MCP over HTTP (POST /mcp, bearer api_token); /status needs the token; /healthz is open"
options:
  brain_dir: "/share/brain"
  api_token: ""
  codex_read_token: ""
  codex_todo_token: ""
  read_only: true
  port: 8820
  rate_per_min: 120
  apple_notes_dir: "/share/apple_notes_staging"
  apple_notes_live: false
  pocket_live: false
  pocket_interval_min: 0
  pocket_url: ""
  pocket_cloudflare_token: ""
  pocket_key: ""
  scrub_names: ""
  cors_origins: ""
  ingest_url: "http://172.30.32.1:8790"
  ingest_token: ""
  instructions_mode: "off"
  instructions_files:
    - house
  instructions_user_ids: []
schema:
  brain_dir: str
  api_token: password
  codex_read_token: password
  codex_todo_token: password
  read_only: bool
  port: int(1024,65535)
  rate_per_min: int(1,6000)
  apple_notes_dir: str
  apple_notes_live: bool
  pocket_live: bool
  pocket_interval_min: int(0,1440)
  pocket_url: str
  pocket_cloudflare_token: password
  pocket_key: password
  scrub_names: str?
  cors_origins: str?
  ingest_url: str?
  ingest_token: password?
  instructions_mode: list(off|view|edit)?
  instructions_files:
    - "match(^house$)?"
  instructions_user_ids:
    - "match(^[0-9a-f]{32}$)?"
