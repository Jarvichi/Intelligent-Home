name: "Intelligent Home - Brain"
version: "0.1.0"
slug: ih_brain
image: "ghcr.io/jarvichi/{arch}-ih_brain"
description: "Serves the House Brain markdown notes to Claude as an MCP server over HTTP, outside Home Assistant core. Read-only by default; write tools need read_only set to false. Maps the share folder."
arch:
  - aarch64
  - amd64
startup: application
# boot: manual = start it yourself. After install the owner sets: boot auto, watchdog on, auto_update on.
# watchdog: add  watchdog: http://[HOST]:[PORT:8820]/healthz  once boot is auto.
boot: manual
init: false
map:
  - share:rw
ports:
  8820/tcp: 8820
ports_description:
  8820/tcp: "MCP over HTTP (POST /mcp, bearer api_token); /status needs the token; /healthz is open"
options:
  brain_dir: "/share/brain"
  api_token: ""
  read_only: true
  port: 8820
  rate_per_min: 120
schema:
  brain_dir: str
  api_token: password
  read_only: bool
  port: int(1024,65535)
  rate_per_min: int(1,6000)
