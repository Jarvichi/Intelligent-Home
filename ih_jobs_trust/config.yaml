name: "Intelligent Home - Jobs - AI Trust Test"
version: "0.1.1"
slug: ih_jobs_trust
description: "Child of Intelligent Home - Jobs. Monthly test of the outside AIs through the AI layer (fixed non-private questions, scored), then a review to-do. Shadow (dry) by default. Registers with the parent."
arch:
  - aarch64
  - amd64
startup: application
# boot: manual = start it yourself (the default here). To start with Home Assistant, set boot: auto (Supervisor option "Start on boot").
# watchdog: add  watchdog: http://[HOST]:[PORT:8810]/healthz  once boot is auto; the Supervisor then restarts the add-on if /healthz stops answering.
boot: manual
init: false
homeassistant_api: true
ports:
  8810/tcp: 8810
ports_description:
  8810/tcp: "Health, status and signed run requests (/healthz, /status, /run)"
options:
  log_payloads: false
  mode: "dry"
  old_loops_disabled: false
  parent_url: "http://172.30.32.1:8792"
  callback_url: ""
  register_key: ""
  own_timer_min: 60
  ai_layer_url: "http://172.30.32.1:8801"
  ai_layer_token: ""
  run_hour: "3"
  todo_entity: "todo.claude_to_do"
  pause_s: "4"
  keep_answers: false
  timezone: "Europe/London"
schema:
  log_payloads: bool?
  mode: list(dry|live)
  old_loops_disabled: bool
  parent_url: str
  callback_url: str?
  register_key: password
  own_timer_min: int(0,1440)
  ai_layer_url: str
  ai_layer_token: password
  run_hour: str
  todo_entity: str
  pause_s: str
  keep_answers: bool
  timezone: str
