name: "Intelligent Home - Wall Display"
version: "0.12.0"
slug: ih_display_wall
image: "ghcr.io/jarvichi/{arch}-ih_display_wall"
description: "Preview and manage a wall display."
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
homeassistant_api: true
ingress: true
ingress_port: 8828
panel_title: "IH · Wall Display"
panel_icon: mdi:television-ambient-light
panel_admin: true
ports:
  8806/tcp: null
ports_description:
  8806/tcp: "Health endpoint, not published"
watchdog: "http://[HOST]:[PORT:8806]/healthz"
options:
  source_url: ""
  image_api_token: ""
  image_url_access: false
  displays_url: ""
  displays_token: ""
  profile_id: ""
  render_entities: []
  render_media_entities: []
  render_game_entities: []
  render_overlay_entities: []
  render_cooking_entity: ""
  render_sun_entity: ""
  render_night_mode: auto
  cooking_url: ""
  cooking_token: ""
  render_intrusion_alert: ""
  render_intrusion_log: ""
  render_intrusion_presence: []
  render_heat_boiler: ""
  render_heat_thermostat: ""
  render_heat_floors: []
  render_doors: []
  render_alarm: ""
  render_presence: []
  render_lights: []
  render_rooms: []
  render_energy:
    current: ""
    next: ""
    electricity: ""
    gas: ""
    calendar: ""
    sessions: ""
    rates_today: ""
    rates_tomorrow: ""
  render_todo_entity: ""
  render_task_feed_entity: ""
  render_shared_messages: false
  render_shared_alerts: false
  weather_forecast_entity: ""
  weather_forecast_fallback_entity: ""
  weather_current_entity: ""
schema:
  source_url: str?
  image_api_token: password?
  image_url_access: bool
  displays_url: str?
  displays_token: password?
  profile_id: str?
  render_entities:
    - str
  render_media_entities:
    - str
  render_game_entities:
    - str
  render_overlay_entities:
    - str
  render_cooking_entity: str?
  render_sun_entity: str?
  render_night_mode: list(auto|light|dark|deep)
  cooking_url: str?
  cooking_token: password?
  render_intrusion_alert: str?
  render_intrusion_log: str?
  render_intrusion_presence:
    - str
  render_heat_boiler: str?
  render_heat_thermostat: str?
  render_heat_floors:
    - str
  render_doors:
    - name: str
      lock: str
      contact: str
  render_alarm: str?
  render_presence:
    - str
  render_lights:
    - name: str
      entities:
        - str
  render_rooms:
    - name: str
      entity: str
  render_energy:
    current: str?
    next: str?
    electricity: str?
    gas: str?
    calendar: str?
    sessions: str?
    rates_today: str?
    rates_tomorrow: str?
  render_todo_entity: str?
  render_task_feed_entity: str?
  render_shared_messages: bool
  render_shared_alerts: bool
  weather_forecast_entity: str?
  weather_forecast_fallback_entity: str?
  weather_current_entity: str?
