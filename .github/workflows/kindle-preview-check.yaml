name: kindle-preview-check
on:
  pull_request:
    branches: [main]
    paths:
      - 'ih_display_kindle/**'
      - 'ih_displays/**'
      - 'ih_display_wall/**'
      - '.github/workflows/kindle-preview-check.yaml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test preview and access controls
        run: python3 -m unittest discover -s ih_display_kindle/tests -q
      - name: Test shared display and wall compatibility
        run: |
          python3 -m unittest discover -s ih_displays/tests -q
          python3 -m unittest discover -s ih_display_wall/tests -q
      - name: Check page script
        run: node --check ih_display_kindle/app/ui/ui.js
      - name: Build add-on image
        run: docker build -t ih-kindle-preview-test ih_display_kindle
      - name: Generate synthetic preview
        run: |
          docker run --rm --entrypoint python ih-kindle-preview-test /app/render_selftest.py --stdout > kindle-preview.png
          docker run --rm --entrypoint python ih-kindle-preview-test /app/render_selftest.py --alert --stdout > kindle-preview-alert.png
          docker run --rm --entrypoint python ih-kindle-preview-test /app/render_selftest.py --short --stdout > kindle-preview-short.png
          docker run --rm --entrypoint python ih-kindle-preview-test /app/render_selftest.py --media --stdout > kindle-preview-media.png
      - uses: actions/upload-artifact@v4
        with:
          name: kindle-preview-synthetic
          path: kindle-preview*.png
